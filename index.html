<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你好，GitHub</title>
<style>
  :root { --ink:#1d1d1f; --paper:#fbfaf7; --accent:#ff6414; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink);
         font-family:-apple-system, "PingFang SC", "Noto Sans SC", sans-serif; padding:16px; }
  .card { max-width:420px; width:100%; background:#fff; border-radius:20px; padding:36px 32px;
          box-shadow:0 12px 40px rgba(0,0,0,.08); text-align:center; }
  .dot { width:64px; height:64px; border-radius:50%; background:var(--accent); margin:0 auto 20px; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { margin:6px 0; line-height:1.6; color:#555; }
  .tag { display:inline-block; margin-top:18px; padding:6px 14px; border-radius:999px; background:#f2f0ea; font-size:14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>你好，GitHub</h1>
    <p>这是我在 GitHub 上发的第一个网页。</p>
    <p>一行命令都没敲，是我跟 AI 说了一句话。</p>
    <span class="tag">澳哥AI瞎玩 · 演示</span>
  </div>
</body>
</html>
